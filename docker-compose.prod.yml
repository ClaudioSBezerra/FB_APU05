services:
  # Backend (Go) — roda as migrations sozinho no boot (ver main.go,
  # onDBConnected); não existe comando de migrate externo a chamar.
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fb_apu05-api-prod
    restart: always
    expose:
      - "8081"
    environment:
      - PORT=8081
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
      - DATABASE_URL_APP=postgres://fb_apu05_app:${DB_APP_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
      - DATABASE_URL_PRIVILEGIADA=postgres://fb_apu05_privilegiado:${DB_PRIVILEGIADA_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - COOKIE_SECURE=true
      - APP_URL=${APP_URL}
      - ALLOWED_ORIGINS=${APP_URL}
      # SSO Keycloak (AD-6) — deixe em branco no Coolify se ainda não houver
      # IdP configurado; o backend sobe normalmente com SSO desabilitado.
      - IAM_BASE_URL=${IAM_BASE_URL:-}
      - IAM_CLIENT_ID=${IAM_CLIENT_ID:-}
      - IAM_REDIRECT_URI=${IAM_REDIRECT_URI:-}
      - IAM_ALLOWED_CLIENT_IDS=${IAM_ALLOWED_CLIENT_IDS:-}
      - IAM_SCOPES=${IAM_SCOPES:-}
      # SMTP (recuperação de senha do login local — ForgotPasswordHandler) —
      # deixe em branco para desabilitar: sem SMTP_PASSWORD, o endpoint
      # responde 500 só quando alguém de fato pede redefinição (o resto do
      # app sobe normalmente sem isso).
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fb_net
    # Mitigação (15/10) da janela de Gateway Timeout pós-deploy: db/api/web
    # são recriados juntos a cada deploy (mesmo "application" no Coolify —
    # o conserto definitivo é separar o banco como recurso próprio, ainda
    # não feito). Enquanto isso, intervalos mais curtos aqui e em `db`/`web`
    # só encurtam a DETECÇÃO de "ficou saudável" — não eliminam o reinício
    # do Postgres em si. start_period/retries mantêm margem real (~40s)
    # para um boot mais lento (ex. migration nova), só não ficam parados
    # até 30-40s só para a PRIMEIRA checagem.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/health"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Frontend (build estático + nginx) — único serviço exposto ao domínio;
  # proxya /api internamente para o container `api` (ver frontend/nginx.conf).
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fb_apu05-web-prod
    restart: always
    expose:
      - "80"
    depends_on:
      api:
        # Antes: só esperava o CONTAINER do api existir (não ele responder
        # de verdade) — nginx podia subir e já aceitar tráfego do Traefik
        # antes do /api/* funcionar, virando 502/504 pro usuário. Agora só
        # sobe depois que o healthcheck do api já passou.
        condition: service_healthy
    networks:
      - fb_net
    # Sobrescreve o HEALTHCHECK da imagem (frontend/Dockerfile, intervalo
    # 30s/start-period 10s) com a mesma detecção mais rápida do api/db.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fb-apu05-web.rule=Host(`controladoria.fbtax.cloud`)"
      - "traefik.http.routers.fb-apu05-web.entrypoints=https"
      - "traefik.http.routers.fb-apu05-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.fb-apu05-web.middlewares=fb-apu05-compress"
      - "traefik.http.middlewares.fb-apu05-compress.compress=true"
      - "traefik.http.services.fb-apu05-web.loadbalancer.server.port=80"
      # Redirect HTTP->HTTPS próprio (19/10): o Coolify gera automaticamente
      # um router de redirect na entrypoint "http" (nome
      # "http-0-<hash-do-app>-web"), mas nesta instância (4.0.0-beta.463)
      # esse router nasce com uma regra inválida —
      # Host(``) && PathPrefix(`controladoria.fbtax.cloud`) — e o Traefik
      # nunca consegue registrá-lo (erro reaparece nos logs do proxy a cada
      # ~1min, continuamente). Em vez de depender do router quebrado do
      # Coolify, declaramos o nosso próprio (nome diferente, sem colidir):
      # pega qualquer request em texto puro (porta 80) para este domínio e
      # manda para https.
      - "traefik.http.routers.fb-apu05-web-http.rule=Host(`controladoria.fbtax.cloud`)"
      - "traefik.http.routers.fb-apu05-web-http.entrypoints=http"
      - "traefik.http.routers.fb-apu05-web-http.middlewares=fb-apu05-redirect-https"
      - "traefik.http.middlewares.fb-apu05-redirect-https.redirectscheme.scheme=https"

  # Cloudflare Tunnel (21/10) — conector de saída que expõe este app via
  # Cloudflare sem abrir nenhuma porta pública na VPS (hoje o IP de origem
  # fica exposto direto, sem WAF/DDoS/CDN na frente — confirmado via
  # `curl -I https://controladoria.fbtax.cloud`, headers batem com nginx
  # puro, sem `cf-ray`). Adicionado em modo DORMENTE de propósito: sem
  # `CLOUDFLARE_TUNNEL_TOKEN` setado no Coolify, este container fica só
  # reiniciando e falhando sozinho (restart: always) — não afeta `api`/
  # `web`/`db` em nada, é um serviço isolado.
  #
  # Passo a passo pra ativar (manual, painel Cloudflare — não dá pra
  # automatizar daqui):
  #   1. Zero Trust -> Networks -> Tunnels -> Create a tunnel (tipo
  #      "Cloudflared"), nome ex. "fb-apu05-prod".
  #   2. Copiar o token gerado e setar CLOUDFLARE_TUNNEL_TOKEN no Coolify
  #      (nunca commitar o valor real aqui).
  #   3. Na aba "Public Hostname" do túnel: Subdomain=controladoria,
  #      Domain=fbtax.cloud, Service=http://web:80 (nome do serviço nesta
  #      mesma rede docker, não um IP).
  #   4. Confirmar que o site responde via esse hostname (DNS já é
  #      apontado automaticamente pelo Cloudflare ao criar o Public
  #      Hostname — não precisa mexer no DNS manualmente).
  #   5. SÓ DEPOIS de confirmar que funciona: remover os labels
  #      `traefik.*` do serviço `web` abaixo (eles ficam de fallback
  #      enquanto o túnel não está validado) — sem isso, o IP de origem
  #      continua respondendo em paralelo ao túnel, o que anula boa parte
  #      do ganho de segurança (DDoS/WAF só protegem quem passa pelo
  #      Cloudflare).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: fb_apu05-cloudflared-prod
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - fb_net
    depends_on:
      web:
        condition: service_healthy

  # Banco de Dados
  db:
    image: postgres:15-alpine
    container_name: fb_apu05-db-prod
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - fb_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s

networks:
  fb_net:
    driver: bridge

volumes:
  postgres_data_prod:
    driver: local
