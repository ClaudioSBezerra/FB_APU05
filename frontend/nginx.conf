server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Default do nginx é 1m — bem menor que o maior MaxBytesReader do
    # backend (20MB, ex. ImportarCadastroHandler/colaboradores_oracle_sync.go/
    # fornecedores_oracle_sync.go). Sem isso, um corpo de requisição maior
    # que 1MB (ex. CSV de fornecedores, 2.8MB) nunca chega no Go — o nginx
    # já responde 413 sozinho.
    client_max_body_size 60m;
    # (16/11) 60m, não 25m: o Controle TI aceita a planilha Forecast + KSB1 + KSB2 numa
    # só importação. O limite de cada arquivo (25 MB) e o total (60 MB) são do próprio
    # backend (handlers/controle_ti.go); aqui só não pode ficar abaixo deles.

    # Headers de segurança (21/10) — nenhum estava configurado antes.
    # `always` manda em toda resposta, inclusive erro (4xx/5xx), não só 2xx.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API: mesmo domínio, reverse-proxy interno para o container `api`
    # (nome de serviço do docker-compose.prod.yml, resolvido pela rede
    # interna do Coolify/Docker).
    location /api/ {
        proxy_pass http://api:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Carga CSV de cadastros mestres (20/10) — ImportarCadastroHandler roda
        # tudo numa única transação e só responde no final; o default do nginx
        # (60s) estourava 504 bem antes de terminar uma carga de dezenas de
        # milhares de linhas (ex. fornecedores via Oracle). 300s casa com
        # ReadTimeout/WriteTimeout do http.Server em backend/main.go — não tem
        # sentido o proxy cortar antes do próprio backend.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Painel do Controle TI (16/11): página estática que roda num <iframe sandbox>
    # do próprio sistema (ControleTI.tsx). É a ÚNICA exceção ao X-Frame-Options
    # DENY do servidor — SAMEORIGIN, e só aqui: só o nosso domínio pode emoldurá-la.
    # `add_header` dentro de um location APAGA os do nível do server, então os de
    # segurança são repetidos. A CSP deixa o painel sem rede nenhuma (connect-src
    # 'none'), sem formulários e sem scripts de fora; a fonte e as logos são data:.
    location /painel-ti/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'" always;
        # o painel muda de versão junto com o deploy: sempre revalida
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # SPA: qualquer rota que não seja /api/* cai no index.html
    # (react-router faz o roteamento no cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
