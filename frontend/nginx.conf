server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API: mesmo domínio, reverse-proxy interno para o container `api`
    # (nome de serviço do docker-compose.prod.yml, resolvido pela rede
    # interna do Coolify/Docker).
    location /api/ {
        proxy_pass http://api:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: qualquer rota que não seja /api/* cai no index.html
    # (react-router faz o roteamento no cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
