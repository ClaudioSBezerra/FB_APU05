# Bloco para o nginx_proxy do servidor AWS (aws-fc) — orcamento.ferreiracosta.com.br.
# Arquivo real: /apps/infra-server-fercos-sap/nginx/config/nginx.conf (dono: cleyton-alves).
#
# 1) dentro de `http { ... }`, junto dos outros `upstream`:
upstream orcamento_web_backend {
    server 172.17.0.1:3012;   # container orcamento-web (publicado na 3012 do host)
    keepalive 16;
}

# 2) junto dos outros `server`:
# O ALB interno (cert wildcard *.ferreiracosta.com.br no ACM) termina o TLS e fala com o
# servidor em HTTP/80 (ajustar para 443 + certificado se o target group for HTTPS).
# Este server é mais específico que o `default_server` da porta 80 (que redireciona para
# HTTPS), então o ALB não leva 301.
server {
    listen 80;
    server_name orcamento.ferreiracosta.com.br;

    # uploads de planilhas (Controle TI aceita até 60 MB no total)
    client_max_body_size 60m;

    location / {
        proxy_pass http://orcamento_web_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # o TLS é do ALB: repassa o esquema original (o app usa cookie Secure)
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

# 3) aplicar:  cp nginx.conf nginx.conf.bak-orcamento-$(date +%Y%m%d%H%M)
#              docker exec nginx_proxy nginx -t && docker exec nginx_proxy nginx -s reload
